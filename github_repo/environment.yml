name: hypergraph-meta-ppi
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python>=3.8
  - pytorch>=1.10.0
  - torchvision
  - cudatoolkit=11.3  # Adjust based on your CUDA version
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - pip
  - pip:
    - dhg>=0.9.0
    - safetensors
    - biopython
    - transformers
    - networkx
